name: Generate Combined Gene Table

on:
  workflow_dispatch:  # Allows manual triggering
  schedule:
    # Run every 2 days at 2 AM UTC (adjust timezone as needed)
    #- cron: '0 2 */2 * *'
    # Run once a month on the 1st at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 1 * *'

jobs:
  generate-gene-table:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Cache LLM response database
      id: cache-llm-db
      uses: actions/cache@v3
      with:
        path: .cache/llm_response_cache.db
        key: ${{ runner.os }}-llm-cache-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-llm-cache-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Generate combined gene table
      run: |
        python3.9 annotation_utils/generate_combined_gene_table.py --force
        
    - name: Add phenotype summary using AI
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python3.9 annotation_utils/add_phenotype_summary_using_AI.py combined_mendelian_gene_disease_table.tsv.gz
        
    #- name: Authenticate to Google Cloud
    #  uses: google-github-actions/auth@v2
    #  with:
    #    credentials_json: ${{ secrets.GCP_SA_KEY }}
    #    
    #- name: Set up Cloud SDK
    #  uses: google-github-actions/setup-gcloud@v2
    #  
    #- name: Load table to BigQuery
    #  run: |
    #    # Create dataset if it doesn't exist
    #    bq mk --dataset --location=US ${{ secrets.GCP_PROJECT_ID }}:gene_annotations || true
    #    
    #    # Load the final table with phenotype summaries to BigQuery
    #    bq load --source_format=CSV \
    #      --field_delimiter="\t" \
    #      --skip_leading_rows=1 \
    #      --replace \
    #      ${{ secrets.GCP_PROJECT_ID }}:gene_annotations.combined_mendelian_gene_disease_table \
    #      combined_mendelian_gene_disease_table_with_phenotype_summary.tsv.gz
      
    - name: Upload generated files as artifacts
      uses: actions/upload-artifact@v3
      if: always()  # Upload artifacts even if the script fails
      with:
        name: gene-table-outputs
        path: |
          combined_mendelian_gene_disease_table_with_phenotype_summary.tsv.gz
        retention-days: 30
